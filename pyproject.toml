[project]
name = "marrow-ito-search"
version = "0.1.0"
description = "Standalone Flask app for prototyping semantic search across MCQ/QBank/Video/Test content"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "pymongo>=4.6.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "flask-cors>=4.0.0",
    "pyspellchecker>=0.8.0",
    "anthropic>=0.105.2",
    "pytesseract>=0.3.13",
    "pillow>=12.2.0",
]

[dependency-groups]
ingest = [
    "sentence-transformers>=2.5.0",
    "faiss-cpu>=1.7.4",
    "numpy>=1.24.0",
    "tqdm>=4.66.0",
]

[tool.uv]
package = false
