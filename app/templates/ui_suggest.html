{% extends "base.html" %}
{% block title %}Suggest API · Marrow-ito-search{% endblock %}
{% block content %}
<style>
    .demo-head { margin-bottom: 0.25rem; }
    .demo-sub { color: #57606a; margin-top: 0; font-size: 0.92rem; }
    .demo-sub code { background: #f6f8fa; padding: 0.1rem 0.35rem; border-radius: 4px; }
    .sg-wrap { position: relative; max-width: 560px; margin: 1.5rem 0; }
    .sg-input {
        width: 100%; box-sizing: border-box;
        padding: 0.7rem 1rem; font-size: 1.05rem;
        border: 1px solid #d0d7de; border-radius: 10px;
    }
    .sg-input:focus { outline: 2px solid #0969da; outline-offset: -1px; }
    .sg-drop {
        position: absolute; top: calc(100% + 4px); left: 0; right: 0;
        background: #fff; border: 1px solid #d0d7de; border-radius: 10px;
        box-shadow: 0 6px 20px rgba(31,35,40,0.12);
        overflow: hidden; z-index: 50; display: none;
    }
    .sg-drop.open { display: block; }
    .sg-row {
        display: flex; align-items: center; gap: 0.6rem;
        padding: 0.6rem 0.9rem; cursor: pointer;
        border-bottom: 1px solid #f0f2f4; text-decoration: none; color: inherit;
    }
    .sg-row:last-child { border-bottom: none; }
    .sg-row:hover, .sg-row.focused { background: #f6f8fa; }
    .sg-text { font-weight: 600; }
    .sg-ctx { color: #57606a; font-size: 0.85rem; margin-left: auto; }
    .sg-empty { padding: 0.8rem 0.9rem; color: #8c959f; font-size: 0.88rem; }
    .badge {
        font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.04em;
        padding: 0.12rem 0.45rem; border-radius: 999px; font-weight: 600;
        flex-shrink: 0;
    }
    .badge.concept       { background: #ddf4ff; color: #0969da; }
    .badge.subtopic      { background: #dafbe1; color: #1a7f37; }
    .badge.intent        { background: #faf2ff; color: #8250df; }
    .badge.disambiguation{ background: #fff1cf; color: #8a6500; }
    .json-panel {
        margin-top: 1.5rem; background: #0d1117; color: #c9d1d9;
        border-radius: 8px; padding: 1rem; font-size: 0.8rem;
        overflow-x: auto; white-space: pre; min-height: 2rem;
    }
    .json-label { color: #57606a; font-size: 0.8rem; margin: 1.5rem 0 0.3rem; }
    .hint { color: #8c959f; font-size: 0.85rem; }
</style>

<nav class="crumbs">
    <a href="{{ url_for('browse.index') }}">Home</a>
    <span class="sep">/</span> Suggest API
</nav>

<h1 class="demo-head">Suggest API</h1>
<p class="demo-sub">As-you-type concept suggestions · <code>GET /api/suggest?q=</code></p>

<div class="sg-wrap">
    <input id="sg-input" class="sg-input" type="search" autocomplete="off"
           placeholder="Try: ib, mi, panto, vitamin, urinary…" aria-label="Suggest query">
    <div id="sg-drop" class="sg-drop" role="listbox"></div>
</div>

<p class="hint">Click a suggestion to run it through the Search API page.</p>

<div class="json-label">Raw response</div>
<pre id="sg-json" class="json-panel">{}</pre>

<script>
(function () {
    const input = document.getElementById('sg-input');
    const drop = document.getElementById('sg-drop');
    const jsonPanel = document.getElementById('sg-json');
    let timer = null, lastQ = '', focusedIdx = -1;

    const esc = (s) => String(s).replace(/[&<>"']/g, c =>
        ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    const searchHref = (text) => `{{ url_for('concept_ui.search_ui') }}?q=` + encodeURIComponent(text);

    const render = (rows) => {
        if (!rows.length) {
            drop.innerHTML = '<div class="sg-empty">No concept matches.</div>';
            drop.classList.add('open');
            return;
        }
        drop.innerHTML = rows.map((r, i) =>
            `<a class="sg-row" data-idx="${i}" href="${searchHref(r.text)}">`
          + `<span class="badge ${esc(r.type)}">${esc(r.type)}</span>`
          + `<span class="sg-text">${esc(r.text)}</span>`
          + `<span class="sg-ctx">${esc(r.context)}</span></a>`
        ).join('');
        drop.classList.add('open');
        focusedIdx = -1;
    };

    const fetchSuggest = (q) => {
        fetch(`/api/suggest?q=${encodeURIComponent(q)}`)
            .then(r => r.json())
            .then(data => {
                if (data.query !== lastQ) return;  // drop stale responses
                jsonPanel.textContent = JSON.stringify(data, null, 2);
                render(data.suggestions || []);
            });
    };

    input.addEventListener('input', () => {
        const q = input.value.trim();
        lastQ = q;
        if (timer) clearTimeout(timer);
        if (!q) { drop.classList.remove('open'); jsonPanel.textContent = '{}'; return; }
        timer = setTimeout(() => fetchSuggest(q), 120);
    });

    input.addEventListener('keydown', (e) => {
        const items = drop.querySelectorAll('.sg-row');
        if (!drop.classList.contains('open') || !items.length) return;
        if (e.key === 'ArrowDown') { e.preventDefault(); focusedIdx = (focusedIdx + 1) % items.length; }
        else if (e.key === 'ArrowUp') { e.preventDefault(); focusedIdx = (focusedIdx - 1 + items.length) % items.length; }
        else if (e.key === 'Enter' && focusedIdx >= 0) { e.preventDefault(); items[focusedIdx].click(); return; }
        else if (e.key === 'Escape') { drop.classList.remove('open'); return; }
        else { return; }
        items.forEach((el, i) => el.classList.toggle('focused', i === focusedIdx));
    });

    document.addEventListener('click', (e) => {
        if (!drop.contains(e.target) && e.target !== input) drop.classList.remove('open');
    });
})();
</script>
{% endblock %}
